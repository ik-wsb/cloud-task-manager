services:
  database:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: cloud-task-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=SuperStrongPassword123!
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloud-task-backend
    ports:
      - "8081:8080"
    depends_on:
      - database

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloud-task-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  sql-data: